[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    runner: covers code the live trader executes; a failure here stops the 09:25 sleeve
    golden: runs production code over a hand-computed synthetic frame from tests/golden/;
        the assertion is arithmetic worked out in advance, not a recorded output
    acceptance: an end-to-end money or prop-firm rule the system must satisfy before any
        result from it is quotable; slower than a unit test and worth it
filterwarnings =
    ignore::DeprecationWarning
